on:
  pull_request:

permissions:
  contents: read

jobs:
  check-dependency-availability:
    name: Check fresh compile and assemble of netCDF-Java project
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
      - name: Build with Gradle (refresh dependencies)
        run: ./gradlew clean classes testClasses assemble --refresh-dependencies
      - name: Build sourceJars
        run: ./gradlew sourceJar
