on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'native-compression/libaec-jna/**'
      - 'native-compression/libaec-native/**'
      - '.github/workflows/test-native-compression-aec.yml'

permissions:
  contents: read

jobs:
  tests:
    strategy:
      matrix:
        os: [
          ubuntu-24.04,
          ubuntu-24.04-arm,
          windows-2022,
          macos-15,
          macos-15-intel,
          macos-26
        ]
    name: netCDF-Java Native Compression Tests (aec)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup JDK 8, 17
        if: ${{ matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15-intel' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
      - name: Setup JDK 21
        if: ${{ matrix.os != 'ubuntu-24.04' && matrix.os != 'macos-15-intel' }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Run libaec JNA tests
        if: ${{ matrix.os == 'ubuntu-24.04' || matrix.os == 'macos-15-intel'  }}
        run: ./gradlew -Dorg.gradle.java.installations.auto-detect=true clean :libaec-jna:test
        env:
          JDK8: /usr/thredds-test-environment/temurin8
      - name: Run libaec JNA tests (JDK 21 tests)
        if: ${{ matrix.os != 'ubuntu-24.04' && matrix.os != 'macos-15-intel' }}
        run: ./gradlew clean :libaec-jna:test21
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: NativeCompression_JUnit_Results_${{ github.sha }}_-${{ matrix.os }}
          path: native-compression/libaec-jna/build/reports/tests
