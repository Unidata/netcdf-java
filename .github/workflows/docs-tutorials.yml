on:
  pull_request:

permissions:
  contents: read

jobs:
  check-doc-build:
    name: netCDF-Java Documentation Code Deprecation Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Java 8, 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: |
            8
            17
      - name: Cache Gradle packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      - name: Check netCDF-Java documentation for deprecations warnings
        run: './gradlew :docs:testClasses |& (! grep -F "warning: [deprecation]")'
