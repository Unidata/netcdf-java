#
# Build zstd on windows (x86-64, aarch64), linux (x86-64, aarch64),
# and mac (x86-64, aarch64) and combine into a single artifact for use
# by netCDF-Java.
#
# The version of zstd is used twice in this workflow - once in the
# ref of the checkout, and once in the name of the final artifact.
# Be sure to update both places if incrementing the version of
# zstd being used.
#
name: zstd build using CMake on multiple platforms

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        build_env: [
          {os: ubuntu-24.04, c_compiler: gcc, lib: '/lib/libzstd.so', jna_id: 'linux-x86-64'},
          {os: ubuntu-24.04-arm, c_compiler: gcc, lib: '/lib/libzstd.so', jna_id: 'linux-aarch64'},
          {os: windows-2022, c_compiler: cl, lib: '/lib/Release/zstd.dll', jna_id: 'win32-x86-64'},
          {os: windows-11-arm, c_compiler: cl, lib: '/lib/Release/zstd.dll', jna_id: 'win32-aarch64'},
          {os: macos-15, c_compiler: clang, lib: '/lib/libzstd.dylib', jna_id: 'darwin-aarch64'},
          {os: macos-15-intel, c_compiler: clang, lib: '/lib/libzstd.dylib', jna_id: 'darwin-x86-64'},
        ]
        build_type: [Release]

    runs-on: ${{ matrix.build_env.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: 'meta/zstd'
          ref: 'f8745da6ff1ad1e7bab384bd1f9d742439278e99' #v1.5.7

      - name: Set shared values
        id: strings
        shell: bash
        run: |
          echo "build-dir=${{ github.workspace }}/cmake-build" | sed 's/\\/\//g' >> "$GITHUB_OUTPUT"
          echo "src-dir=${{ github.workspace }}" | sed 's/\\/\//g' >> "$GITHUB_OUTPUT"

      - name: Configure CMake
        run: >
          cmake -B ${{ steps.strings.outputs.build-dir }}
          -DCMAKE_C_COMPILER=${{ matrix.build_env.c_compiler }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          -DZSTD_BUILD_TESTS=ON
          -S ${{ steps.strings.outputs.src-dir }}/build/cmake

      - name: Build
        run: cmake --build ${{ steps.strings.outputs.build-dir }} --config ${{ matrix.build_type }}

      - name: Test
        working-directory: ${{ steps.strings.outputs.build-dir }}
        run: ctest --build-config ${{ matrix.build_type }}

      - name: Prepare ${{ matrix.build_env.jna_id }} library for archive
        shell: bash
        working-directory: ${{ steps.strings.outputs.build-dir }}
        run: |
          mkdir resources
          mkdir resources/${{ matrix.build_env.jna_id }}
          cp ${{ steps.strings.outputs.src-dir }}/LICENSE resources/${{ matrix.build_env.jna_id }}/libzstd-LICENSE
          cp ${{ steps.strings.outputs.build-dir }}${{ matrix.build_env.lib }} resources/${{ matrix.build_env.jna_id }}

      - name: Upload ${{ matrix.build_env.jna_id }} artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libzstd-${{ matrix.build_env.jna_id }}
          path: ${{ steps.strings.outputs.build-dir }}/resources

  merge:
    needs: build

    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: libzstd-*
          path: native/resources/
          merge-multiple: true

      - name: Display contents of the combined native artifact
        run: find native/ -type f -exec ls -lh {} \;

      - name: Upload merged artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: libzstd-native-1.5.7-${{ github.sha }}
          path: native/